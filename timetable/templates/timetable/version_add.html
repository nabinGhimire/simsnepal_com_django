{% extends "timetable/base.html" %}

{% block title %}Add Timetable Version{% endblock %}

{% block tt_content %}
<div style="padding:1.25rem;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;">
    <div>
      <h2 style="font-size:1.4rem;font-weight:700;color:var(--tt-text-dark);margin:0;">Add Timetable Version</h2>
      <p style="font-size:0.85rem;color:var(--tt-text-muted);margin:2px 0 0 0;">Create a new immutable timetable snapshot for your school.</p>
    </div>
    <a href="{% url 'timetable:version_list' %}" class="tt-btn tt-btn-primary"><i class="ti ti-arrow-left me-1"></i> Back</a>
  </div>

  <div class="tt-card" style="max-width:600px;">
    <form method="POST" style="padding:20px;">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;font-weight:600;color:var(--tt-text-dark);">Version Number</label>
        <input type="number" name="version_no" class="tt-input" placeholder="1" required style="width:100%;padding:0.5rem 0.75rem;border:1px solid var(--tt-border);border-radius:6px;background:var(--tt-card-bg);color:var(--tt-text-dark);font-size:0.85rem;">
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;font-weight:600;color:var(--tt-text-dark);">Academic Year</label>
        <select name="academic_year" class="tt-input" required style="width:100%;padding:0.5rem 0.75rem;border:1px solid var(--tt-border);border-radius:6px;background:var(--tt-card-bg);color:var(--tt-text-dark);font-size:0.85rem;">
          {% for session in sessions %}
          <option value="{{ session.id }}">Session {{ session.year }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;font-weight:600;color:var(--tt-text-dark);">Effective From (BS Date)</label>
        <input type="text" name="effective_from" class="tt-input" placeholder="2083-01-01" required style="width:100%;padding:0.5rem 0.75rem;border:1px solid var(--tt-border);border-radius:6px;background:var(--tt-card-bg);color:var(--tt-text-dark);font-size:0.85rem;">
        <p style="font-size:0.75rem;color:var(--tt-text-muted);margin-top:0.25rem;">Nepali calendar date in YYYY-MM-DD format.</p>
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;font-weight:600;color:var(--tt-text-dark);">Status</label>
        <select name="status" class="tt-input" style="width:100%;padding:0.5rem 0.75rem;border:1px solid var(--tt-border);border-radius:6px;background:var(--tt-card-bg);color:var(--tt-text-dark);font-size:0.85rem;">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:0.85rem;font-weight:600;color:var(--tt-text-dark);">Change Note</label>
        <textarea name="change_note" class="tt-input" placeholder="Optional note about this version..." rows="2" style="width:100%;padding:0.5rem 0.75rem;border:1px solid var(--tt-border);border-radius:6px;background:var(--tt-card-bg);color:var(--tt-text-dark);font-size:0.85rem;"></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;">
        <a href="{% url 'timetable:version_list' %}" class="tt-btn tt-btn-ghost" style="font-size:0.85rem;">Cancel</a>
        <button type="submit" class="tt-btn tt-btn-primary" style="font-size:0.85rem;">Create Version</button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
