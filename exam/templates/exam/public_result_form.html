{% extends 'exam/base.html' %}
{% block title %}Public Result{% endblock %}

{% block exam_content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm" style="border:1px solid var(--exam-border);border-radius:8px;">
        <div class="card-header bg-white">
          <h3 class="card-title mb-0">Public Result</h3>
        </div>
        <div class="card-body">
          <form method="POST" action="{% url 'exam:public_result' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Registration Number</label>
              <input type="text" name="regno" class="exam-input" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Security Code (Pin)</label>
              <input type="password" name="scode" class="exam-input" required>
            </div>
            <button type="submit" class="exam-btn exam-btn-primary w-100">
              <i class="fa-solid fa-search me-1"></i> View Result
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
