<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Print Entrance Card</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
        integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; padding: 20px; }
        .card { border: 1px solid #dee2e6; border-radius: 0.375rem; margin-bottom: 20px; }
        .footer { width: 100%; text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #dee2e6; }
        .footer td { border: 0; }
        .nobr { white-space: nowrap; }
        .gs-cent { text-align: center; }
        .mgg { margin-bottom: 5px; }
        .bigg { font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form action="" method="GET">
                        {% csrf_token %}

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <div class="text-secondary small">School</div>
                                <div class="fw-semibold">{{ school.name }}</div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-secondary small">Location</div>
                                <div class="fw-semibold">{{ school.location }}</div>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="term">Exam Term</label>
                                <select name="term" id="term" class="form-select">
                                    {% for exam_type in exam_types %}
                                    <option value="{{ exam_type.id }}">{{ exam_type.term_name|upper }} {{ exam_type.year }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Year</label>
                                <div class="form-control-plaintext">{{ year }}</div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Type</label>
                                <div class="d-flex flex-wrap gap-3">
                                    <label class="form-check">
                                        <input class="form-check-input" type="radio" name="whattype" value="detail" checked>
                                        <span class="form-check-label">Detail</span>
                                    </label>
                                    <label class="form-check">
                                        <input class="form-check-input" type="radio" name="whattype" value="blank">
                                        <span class="form-check-label">Blank</span>
                                    </label>
                                    <label class="form-check">
                                        <input class="form-check-input" type="radio" name="whattype" value="image">
                                        <span class="form-check-label">Detail With Image</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" onclick="this.form.target='_blank';" class="btn btn-primary">
                                <i class="fas fa-print me-1"></i> Print Entrance Card
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
