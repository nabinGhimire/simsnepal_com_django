{% extends 'exam/base.html' %}
{% block title %}Print Marks Form{% endblock %}

{% block exam_content %}
<div class="card shadow-sm" style="border:1px solid var(--exam-border);border-radius:8px;max-width:700px;">
  <div class="card-body">
    <form action="" method="POST" class="form-horizontal">
      {% csrf_token %}

      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.72rem;color:var(--exam-text-muted);font-weight:600;">School</label>
        <div class="col">
          <div class="form-control-plaintext font-weight-bold">{{ school.name }}</div>
        </div>
      </div>
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.72rem;color:var(--exam-text-muted);font-weight:600;">Year</label>
        <div class="col">
          <div class="form-control-plaintext font-weight-bold">{{ this_year }}</div>
        </div>
      </div>

      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Exam Term</label>
        <div class="col">
          <select name="term" class="exam-select" required>
            <option value="" disabled selected>Select Term</option>
            {% for exam_type in exam_types %}
            <option value="{{ exam_type.id }}">{{ exam_type.term_name|upper }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Grade</label>
        <div class="col">
          <select name="grade" id="grade" class="exam-select" onchange="populate(this.id,'section')" required>
            <option value="" disabled selected>Select Grade</option>
            {% for grade in grades %}
            <option value="{{ grade.id }}">{{ grade|upper }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Section</label>
        <div class="col">
          <select name="section" id="section" class="exam-select" required>
            <option value="" disabled selected>Select Section</option>
          </select>
        </div>
      </div>

      <div class="form-footer text-end mt-4">
        <button type="submit" class="exam-btn exam-btn-primary px-4">
          <i class="fa-solid fa-print me-1"></i> Generate Form
        </button>
      </div>
    </form>
  </div>
</div>

<script>
var section_list_obj = JSON.parse('{{ section_list|escapejs }}');
function populate(s1, s2) {
  var s1El = document.getElementById(s1);
  var s2El = document.getElementById(s2);
  s2El.innerHTML = '<option value="" disabled selected>Select Section</option>';
  var flat = section_list_obj[s1El.value] || {};
  for (var p in flat) {
    var opt = document.createElement('option');
    opt.value = p; opt.innerHTML = flat[p];
    s2El.appendChild(opt);
  }
}
</script>
{% endblock %}
