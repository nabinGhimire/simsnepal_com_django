{% extends 'exam/base.html' %}
{% block title %}Subject-wise Marks Entry{% endblock %}

{% block exam_content %}
<div class="card shadow-sm" style="border:1px solid var(--exam-border);border-radius:8px;max-width:700px;">
  <div class="card-body">
    <form action="" method="POST" class="form-horizontal">
      {% csrf_token %}

      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">School</label>
        <div class="col">
          <div class="form-control-plaintext font-weight-bold">{{ school.name }}</div>
        </div>
      </div>
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Location</label>
        <div class="col">
          <div class="form-control-plaintext">{{ school.location|default:"—" }}</div>
        </div>
      </div>
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Year</label>
        <div class="col">
          <div class="form-control-plaintext">{{ this_year }}</div>
        </div>
      </div>
      <hr class="my-3">
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Exam Term</label>
        <div class="col">
          <select name="term" id="term" class="exam-select">
            {% for exam_type in exam_types %}
            <option value="{{ exam_type.id }}">{{ exam_type.term_name|upper }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Grade</label>
        <div class="col">
          <select name="grade" id="grade" class="exam-select" onchange="populate(this.id,'section')">
            <option value="">— Select Grade —</option>
            {% for grade in grades %}
            <option value="{{ grade.id }}">{{ grade|upper }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Section</label>
        <div class="col">
          <select name="section" id="section" class="exam-select"></select>
        </div>
      </div>
      <div class="mb-3 row">
        <label class="col-3 col-form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Order By</label>
        <div class="col">
          <select name="order" id="order" class="exam-select">
            <option value="1">Registration Number</option>
            <option value="2">Roll Number</option>
            <option value="3">Name</option>
          </select>
        </div>
      </div>
      <div class="form-footer text-end mt-4">
        <button type="submit" class="exam-btn exam-btn-primary px-4">
          <i class="fa-solid fa-arrow-right me-1"></i> Next Step
        </button>
      </div>
    </form>
  </div>
</div>

<script>
var section_list = JSON.parse('{{ section_list|escapejs }}');
function populate(s1, s2) {
  var s1El = document.getElementById(s1);
  var s2El = document.getElementById(s2);
  s2El.innerHTML = '';
  var sl = section_list[s1El.value] || {};
  for (var p in sl) {
    var opt = document.createElement('option');
    opt.value = p;
    opt.innerHTML = sl[p];
    s2El.appendChild(opt);
  }
}
</script>
{% endblock %}
