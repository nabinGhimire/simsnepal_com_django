{% extends 'exam/base.html' %}
{% load exam_extras %}
{% block title %}Print Result{% endblock %}

{% block exam_content %}
<div class="mb-2 py-2 px-3 bg-white" style="border:1px solid var(--exam-border);border-radius:8px;">
  <h6 class="m-0" style="font-weight:700;color:var(--exam-text-dark);">Print Result</h6>
  <span style="font-size:0.75rem;color:var(--exam-text-muted);">Select options to generate and print the result sheet</span>
</div>

<div class="row justify-content-center">
  <div class="col-md-10 col-lg-9">
    <div class="card shadow-sm" style="border:1px solid var(--exam-border);border-radius:8px;">
      <div class="card-body">
        <form action="" method="POST" target="_blank">
          {% csrf_token %}

          <div class="row g-2 mb-3">
            <div class="col-6">
              <div style="font-size:0.72rem;color:var(--exam-text-muted);font-weight:600;">School</div>
              <div style="font-size:0.85rem;font-weight:600;">{{ school.name }}</div>
            </div>
            <div class="col-6">
              <div style="font-size:0.72rem;color:var(--exam-text-muted);font-weight:600;">Location</div>
              <div style="font-size:0.85rem;font-weight:600;">{{ school.location }}</div>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Year</label>
              <select name="edusession" id="edusession" class="exam-select"
                      onchange="filterTerms('edusession','term'); populate2('grade2','section','edusession')">
                {% for session in edusession %}
                <option value="{{ session.id }}" {% if session.id == current_session.id %}selected{% endif %}>{{ session.year }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Exam Term</label>
              <select name="term" id="term" class="exam-select">
                {% for exam_type in exam_types %}
                <option value="{{ exam_type.id }}">{{ exam_type.term_name|upper }} {{ exam_type.year }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Mode</label>
              <select name="mode" id="mode" class="exam-select">
                <option value="calculated">Calculated (uses Result Config)</option>
                <option value="raw">Raw Marks (actual marks only)</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Grade</label>
              <select name="grade2" id="grade2" class="exam-select"
                      onchange="populate2(this.id,'section','edusession')">
                <option value=""></option>
                {% for grade in grades %}
                <option value="{{ grade.id }}">{{ grade|upper }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Section</label>
              <select name="section2" id="section" class="exam-select"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Result Type</label>
              <select name="printtype" class="exam-select">
                <option value="1">Detail (per subject)</option>
                <option value="2">Summary (totals only)</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Filter</label>
              <select name="filter" class="exam-select">
                <option value="0">None</option>
                <option value="1">Pass Only</option>
                <option value="2">Fail Only</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Order By</label>
              <select name="data_order" class="exam-select">
                <option value="1">Registration Number</option>
                <option value="2">Roll Number</option>
                <option value="3">Rank</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Rank By</label>
              <select name="rank_by" class="exam-select">
                <option value="total">Total Marks</option>
                <option value="th">Theory Only</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Grading Type</label>
              <select name="grading_type" class="exam-select">
                <option value="">Use Config</option>
                <option value="0">Legacy</option>
                <option value="1">Non-Grade System</option>
                <option value="2">New Grading System</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Ledger Type</label>
              <select name="ledger_type" class="exam-select">
                <option value="">Use Config</option>
                <option value="1">Marks</option>
                <option value="2">Grade</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" style="font-size:0.78rem;font-weight:600;color:var(--exam-text-muted);">Calculation</label>
              <select name="calculation_type" class="exam-select">
                <option value="">Use Config</option>
                <option value="legacy">Legacy</option>
                <option value="weighted">Weighted</option>
              </select>
            </div>
          </div>

          <div class="mt-4">
            <button type="submit" name="submit" value="Submit" class="exam-btn exam-btn-primary px-4">
              <i class="fa-solid fa-print me-1"></i> Generate Result
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
var section_list_obj = JSON.parse('{{ section_list|escapejs }}');
var term_list_obj = JSON.parse('{{ term_list|escapejs }}');
function filterTerms(yearId, termId) {
  var yearEl = document.getElementById(yearId);
  var termEl = document.getElementById(termId);
  if (!yearEl || !termEl) return;
  var terms = term_list_obj[yearEl.value] || [];
  termEl.innerHTML = '';
  terms.forEach(function(term) {
    var opt = document.createElement('option'); opt.value = term.id; opt.innerHTML = term.name;
    termEl.appendChild(opt);
  });
}
function populate2(s1, s2, y1) {
  var s1El = document.getElementById(s1);
  var s2El = document.getElementById(s2);
  var y1El = document.getElementById(y1);
  if (!s2El || !s1El || !y1El) return;
  s2El.innerHTML = '';
  var sl = (section_list_obj[y1El.value] || {})[s1El.value] || {};
  var opts = ['0|ALL SECTION'];
  for (var p in sl) opts.push(p + '|' + sl[p]);
  opts.forEach(function(o) {
    var pair = o.split('|');
    var opt = document.createElement('option'); opt.value = pair[0]; opt.innerHTML = pair[1];
    s2El.appendChild(opt);
  });
}
document.addEventListener('DOMContentLoaded', function() {
  filterTerms('edusession', 'term');
  populate2('grade2', 'section', 'edusession');
});
</script>
{% endblock %}
